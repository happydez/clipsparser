// Beam materials used to draw clips, and the files clients must download.
//
//   "beam"          material drawn for clips normally.
//   "ignorez_beam"  material drawn for clips through walls (the .vmt must set
//                   "$ignorez" "1").
//   "downloads"     semicolon-separated list of files (paths under the game
//                   directory) the server sends to clients. List every custom
//                   .vmt plus the .vtf texture it references.
//
// You can point "beam" at a stock sprite that every client already has, 
// e.g. "beam" "materials/sprites/laserbeam.vmt"

"clipsparser_downloads"
{
    "beam"          "materials/clipsparser/beam.vmt"
    "ignorez_beam"  "materials/clipsparser/ignorez_beam.vmt"
    "downloads"     "materials/clipsparser/beam.vmt;materials/clipsparser/ignorez_beam.vmt;materials/clipsparser/beam.vtf"
}
